<!-- public/logo.svg -->
<svg width="128" height="128" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="b" x1="20" y1="20" x2="52" y2="52" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A78BFA"/>
            <stop offset="1" stop-color="#60A5FA"/>
        </linearGradient>
    </defs>

    <!-- soft background circle -->
    <circle cx="32" cy="32" r="28" fill="url(#g)" opacity="0.12"/>
    <!-- squircle ring -->
    <path d="M14,22 C14,16 16,14 22,14 H42 C48,14 50,16 50,22 V42 C50,48 48,50 42,50 H22 C16,50 14,48 14,42 Z"
          fill="none" stroke="url(#g)" stroke-width="2.4"/>

    <!-- chat bubble “D” mark -->
    <path d="M24 22h10c6 0 10 4 10 10s-4 10-10 10h-2l-4 4v-4h-4V22z"
          fill="url(#b)" opacity="0.95"/>
    <!-- sparkle dot -->
    <circle cx="41.5" cy="26.5" r="1.8" fill="#22D3EE"/>
</svg>
